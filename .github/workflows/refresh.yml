name: Refresh Ban Lists
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}      # manual trigger
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run importer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTERNAL_FEED_TOKEN: ${{ secrets.EXTERNAL_FEED_TOKEN }}
        run: |
          npm ci
          node scripts/import_feeds.js
      - name: Commit changes
        run: |
          git config user.name "BanBot"
          git config user.email "banbot@example.com"
          git add bans.json flagged.json || true
          if ! git diff --quiet --cached; then
            git commit -m "Auto-refresh bans @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes"
          fi
